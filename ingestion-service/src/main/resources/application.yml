spring:
  application:
    name: ingestion-service
  datasource:
    url: ${INGESTION_SERVICE_DB_URL}
    username: ${INGESTION_SERVICE_DB_USER}
    password: ${INGESTION_SERVICE_DB_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations — Hibernate must never alter it
      ddl-auto: validate
    # SQL logging is helpful locally but noisy in containers, so it defaults
    # off; set HIBERNATE_SHOW_SQL=true to echo statements when debugging.
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    user: ${INGESTION_SERVICE_DB_USER}
    password: ${INGESTION_SERVICE_DB_PASSWORD}
    url: ${INGESTION_SERVICE_DB_URL}

server:
  port: ${INGESTION_SERVICE_PORT:8081}

# Shared secret that AOI stations must present as the X-Device-Api-Key header
# on write (POST) endpoints. Read (GET) endpoints stay open for the dashboard
# and analytics-service in this phase.
inspectiq:
  device-api-key: ${DEVICE_API_KEY:}
  cors:
    # Comma-separated allowlist; the Angular dev server runs on 4200
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html