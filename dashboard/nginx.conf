# ============================================================================
# dashboard — nginx server block
# Serves the Angular SPA and reverse-proxies the backend API prefixes so the
# whole dashboard runs from a single origin (no CORS preflights at runtime).
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (defense-in-depth at the SPA edge) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Backend API reverse proxies ---
    # The Angular services request `${baseUrl}/api/v1/...` with baseUrls of
    # /api/ingestion, /api/analytics, /api/alerts (prod environment). The
    # trailing '/' in proxy_pass strips the matched prefix, so
    #   /api/ingestion/api/v1/batches
    # is forwarded upstream as
    #   http://ingestion-service:8081/api/v1/batches
    location /api/ingestion/ {
        proxy_pass http://ingestion-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/alerts/ {
        proxy_pass http://alert-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA fallback ---
    # Unknown paths hand off to Angular's index.html so client-side routing
    # (e.g. /batches/:id) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}