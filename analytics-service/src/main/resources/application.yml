spring:
  application:
    name: analytics-service
  datasource:
    url: ${ANALYTICS_SERVICE_DB_URL}
    username: ${ANALYTICS_SERVICE_DB_USER}
    password: ${ANALYTICS_SERVICE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: ${ANALYTICS_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
