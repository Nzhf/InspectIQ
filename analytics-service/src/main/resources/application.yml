spring:
  application:
    name: analytics-service
  datasource:
    url: ${ANALYTICS_SERVICE_DB_URL}
    username: ${ANALYTICS_SERVICE_DB_USER}
    password: ${ANALYTICS_SERVICE_DB_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by ingestion-service's Flyway migrations — never alter it
      ddl-auto: validate
    # SQL logging is helpful locally but noisy in containers, so it defaults
    # off; set HIBERNATE_SHOW_SQL=true to echo statements when debugging.
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    open-in-view: false

server:
  port: ${ANALYTICS_SERVICE_PORT:8082}

# Read-only by design: no device API key is required. The dashboard and
# alert-service consume these public GET endpoints directly.
inspectiq:
  cors:
    # Comma-separated allowlist; the Angular dev server runs on 4200
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
