spring:
  application:
    name: alert-service
  datasource:
    url: ${ALERT_SERVICE_DB_URL}
    username: ${ALERT_SERVICE_DB_USER}
    password: ${ALERT_SERVICE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: ${ALERT_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
